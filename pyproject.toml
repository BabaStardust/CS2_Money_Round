[project]
name = "cs2-money-round"
version = "0.1.0"
description = "Explainable CS2 full-buy feasibility and economy simulation"
requires-python = ">=3.12,<3.14"
dependencies = [
    "anthropic>=2.6.0",
    "demoparser2==0.42.0",
    "fastapi>=0.162.4",
    "hopsworks[python]==5.1.*",
    "joblib>=1.6.0",
    "numpy>=2.4.6",
    "openai>=3.46.0",
    "pandas>=2.3.3",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
cs2-money-round = "cs2_money_round.cli:main"

[project.optional-dependencies]
granite = [
    "pillow>=13.0.0",
    "torch>=2.15.0",
    "transformers>=4.49",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyright]
venvPath = "."
venv = ".venv"
